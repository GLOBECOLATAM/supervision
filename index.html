function pintarMapa(ajustar,alRecorrido){
  if(!MAP)return;
  const x=X,NV=S.cfg.diasAlDia||30,pendC=css('--pend')||'#4A6076';
  CAPAS.zonas.clearLayers();CAPAS.pts.clearLayers();CAPAS.rec.clearLayers();
  $('#mModo').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===MOPT.modo));
  $('#tZonas').classList.toggle('on',MOPT.zonas);$('#tPend').classList.toggle('on',MOPT.pend);

  const pts=[];
  x.geoF.forEach(g=>{if(g.lat==null)return;pts.push({num:g.num,lat:g.lat,lng:g.lng,ruta:g.ruta,t:x.tachos.get(g.num)});});
  x.tachos.forEach(t=>{if(GEO.has(t.num))return;const r=t.regs.find(r=>r.lat!=null);if(r)pts.push({num:t.num,lat:r.lat,lng:r.lng,ruta:r.ruta,t,fuera:true});});

  const clase=p=>{
    if(MOPT.modo==='vigencia'){const u=D.ultimo&&D.ultimo[p.num];if(!u)return 'nunca';const dd=diasDesde(u);return dd<=NV*.75?'aldia':dd<=NV?'porvencer':'vencido';}
    if(MOPT.modo==='ruta')return p.t?'r:'+(p.ruta||'SIN RUTA'):'pend';
    if(MOPT.modo==='revision'){if(!p.t)return 'pend';const rv=p.t.regs.map(r=>r.rev?r.rev[0]:'');return rv.indexOf('OBSERVADO')>=0?'obs':rv.every(v=>v==='APROBADO')?'apr':'sin';}
    return p.fuera?'fuera':estadoDe(p.t);
  };
  const colorDe=k=>k==='pend'||k==='nunca'?pendC:k.startsWith('r:')?rutaColor(k.slice(2)):(MCOL[k]||'#378ADD');
  const nombreDe=k=>k==='aldia'?`Al día (≤ ${Math.round(NV*.75)} días)`:k==='porvencer'?`Por vencer (${Math.round(NV*.75)+1}–${NV} días)`:k==='vencido'?`Vencido (más de ${NV} días)`:k.startsWith('r:')?k.slice(2):(MNOM[k]||k);
  const cnt={};pts.forEach(p=>{p.k=clase(p);cnt[p.k]=(cnt[p.k]||0)+1;});
  const orden=MOPT.modo==='vigencia'?['aldia','porvencer','vencido','nunca']:MOPT.modo==='estado'?['ok','cambios','ajustes','golpe','fuera','pend']:MOPT.modo==='revision'?['sin','apr','obs','pend']:Object.keys(cnt).filter(k=>k!=='pend').sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).concat(['pend']);
  $('#mLeg').innerHTML=orden.filter(k=>cnt[k]||k==='pend').map(k=>{const c=colorDe(k),hueco=k==='pend'||k==='nunca';return `<button data-k="${esc(k)}" class="${MOPT.ocultos[k]?'offl':''}"><span class="sw" style="background:${hueco?'transparent':c};border-color:${c}"></span>${esc(nombreDe(k))}<b>${fmt(cnt[k]||0)}</b></button>`;}).join('');

  if(MOPT.zonas){
    const porRuta=new Map();
    x.geoF.forEach(g=>{if(g.lat==null)return;const k=g.ruta||'SIN RUTA';if(!porRuta.has(k))porRuta.set(k,[]);porRuta.get(k).push([g.lat,g.lng]);});
    porRuta.forEach((ll,ruta)=>{
      const c=rutaColor(ruta),info=x.rutas.find(r=>r.ruta===ruta);
      let p=info?pct(info.hechos,info.total):0;
      if(MOPT.modo==='vigencia'){const l=pts.filter(q=>!q.fuera&&(q.ruta||'SIN RUTA')===ruta);p=pct(l.filter(q=>q.k==='aldia'||q.k==='porvencer').length,l.length);}
      const poly=zona(ll);
      const capa=poly.length>=3?L.polygon(poly,{color:c,weight:1.5,opacity:.9,fillColor:c,fillOpacity:.08,interactive:true}):L.circle(ll[0],{radius:180,color:c,weight:1.5,fillColor:c,fillOpacity:.08});
      capa.bindTooltip(`${esc(ruta)} · ${p}%${MOPT.modo==='vigencia'?' al día':''}`,{permanent:true,direction:'center',className:'zlab'});
      capa.on('click',()=>{F.ruta=F.ruta===ruta?'':ruta;guardarF();pintarSelects();calcular();pintarMapa(true);});
      CAPAS.zonas.addLayer(capa);
    });
  }
  const rend=MAP._rend,ring=temaActual()==='light'?'#FFFFFF':'#0A1724';
  pts.forEach(p=>{
    if(MOPT.ocultos[p.k])return;
    if(p.k==='pend'&&!MOPT.pend)return;
    const c=colorDe(p.k),hueco=p.k==='pend'||p.k==='nunca';
    const m=L.circleMarker([p.lat,p.lng],{renderer:rend,radius:hueco?4.5:6.5,color:hueco?c:ring,weight:hueco?1.6:2,fillColor:c,fillOpacity:hueco?.15:1});
    m.bindPopup(()=>popup(p),{maxWidth:290});
    CAPAS.pts.addLayer(m);
  });

  const eqs=x.equipos.map(e=>e.nombre);
  if(MOPT.equipo&&eqs.indexOf(MOPT.equipo)<0)MOPT.equipo='';
  $('#mEq').innerHTML='<option value="">— Ninguno —</option>'+eqs.map(n=>`<option ${n===MOPT.equipo?'selected':''}>${esc(n)}</option>`).join('');
  $('#mEqInfo').textContent='';
  let recB=null;
  if(MOPT.equipo){
    const e=x.equipos.find(e=>e.nombre===MOPT.equipo),dia=e.jornadas.map(j=>j.fecha).sort().pop();
    const l=e.regs.filter(r=>r.fecha===dia).sort((a,b)=>a.ts-b.ts).map(r=>{const g=GEO.get(r.tacho);const lat=r.lat!=null?r.lat:g&&g.lat,lng=r.lng!=null?r.lng:g&&g.lng;return lat!=null?{r,lat,lng}:null;}).filter(Boolean);
    if(l.length){
      const col=personaColor(e.personas[0]||e.nombre);
      L.polyline(l.map(p=>[p.lat,p.lng]),{color:col,weight:3,opacity:.9,lineJoin:'round'}).addTo(CAPAS.rec);
      l.forEach((p,i)=>{
        const fin=i===l.length-1,ini=i===0;
        const mk=L.circleMarker([p.lat,p.lng],{radius:ini||fin?8:5,color:ring,weight:2,fillColor:ini?'#1D9E75':fin?'#E5484D':col,fillOpacity:1});
        mk.bindTooltip(String(i+1),{permanent:l.length<=40,direction:'top',offset:[0,-6],className:'stp'});
        mk.on('click',()=>detalle(p.r.id));CAPAS.rec.addLayer(mk);
      });
      const j=e.jornadas.find(j=>j.fecha===dia);
      $('#mEqInfo').innerHTML=`<b>${larga(dia)}</b> · ${l.length} paradas · ${j.ini}–${j.fin} (${durTxt(j.min)})<br><span style="color:var(--good)">●</span> inicio · <span style="color:var(--crit)">●</span> último registro`;
      recB=L.latLngBounds(l.map(p=>[p.lat,p.lng]));
    }else $('#mEqInfo').textContent='Ese equipo no tiene ubicaciones en el periodo.';
  }
  if(alRecorrido&&recB){MAP.fitBounds(recB.pad(.25));return;}
  if(ajustar){
    const b=pts.filter(p=>!F.ruta||p.ruta===F.ruta).map(p=>[p.lat,p.lng]);
    if(b.length)MAP.fitBounds(L.latLngBounds(b).pad(.08));else MAP.setView([-1.2491,-78.6168],13);
  }
}
function zona(ll){
  const P=ll.map(([a,b])=>[b,a]).sort((p,q)=>p[0]-q[0]||p[1]-q[1]);
  if(P.length<3)return ll;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  const H=lo.slice(0,-1).concat(up.slice(0,-1));
  const cx=H.reduce((s,p)=>s+p[0],0)/H.length,cy=H.reduce((s,p)=>s+p[1],0)/H.length,k=Math.cos(cy*Math.PI/180);
  return H.map(([x,y])=>{const dx=(x-cx)*k*111320,dy=(y-cy)*110540,L2=Math.hypot(dx,dy)||1,e=90/L2;return[y+(y-cy)*e,x+(x-cx)*e];});
}
function popup(p){

  if(!t){h+=`<div style="color:var(--ink2)">Pendiente en este periodo.</div>${ult?`<div style="margin-top:4px">Último mantenimiento: <b>${larga(ult)}</b></div>`:'<div style="margin-top:4px">Sin mantenimientos registrados.</div>'}`;
    const dias=ult?diasDesde(ult):null;
    if(dias!=null&&dias>S.cfg.diasAlDia)h+=`<div style="margin-top:8px"><span class="tag x"><i></i>Vencido · ${dias} días</span></div>`;
    return h;}
  if(p.fuera)h+='<div style="margin-bottom:6px"><span class="tag"><i></i>No está en GEO TRACK · ubicación del GPS</span></div>';
  t.regs.slice().sort((a,b)=>b.ts-a.ts).slice(0,4).forEach(r=>{
    h+=`<div style="padding:9px 0;border-top:1px solid var(--line)"><b>${larga(r.fecha)} · ${esc(r.hora)}</b><br><span style="color:var(--ink2)">${esc(r.personas.join(' y '))}</span><div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${tagsReg(r)}${revTag(r)}</div>

  return h;
}

async function revisar(r,estado){
  const nota=$('#nota').value.trim();
  if(estado==='OBSERVADO'&&!nota){$('#nota').focus();toast('Escribe qué hay que corregir');return;}
  document.querySelectorAll('.rev .btn').forEach(b=>b.disabled=true);
  try{
    const x=await api({action:'sv_revisar',id:r.id,estado,nota,ciudad:F.ciudad,fecha:r.fecha,tacho:r.tacho,ruta:r.ruta,tecnicos:r.personas.join(' / ')},30000);
    if(!x||!x.ok){toast((MSG[x&&x.error]||['No se pudo guardar'])[0]);document.querySelectorAll('.rev .btn').forEach(b=>b.disabled=false);return;}
    r.rev=estado==='PENDIENTE'?null:x.rev;
    const o=REGS.find(y=>y.id===r.id);if(o)o.rev=r.rev;
    SIG='';calcular();pintarTabs();
    toast(estado==='APROBADO'?'Registro aprobado':estado==='OBSERVADO'?'Observación guardada':'Revisión quitada');
    const sig=X.regs.filter(y=>!y.rev&&y.id!==r.id).sort((a,b)=>b.ts-a.ts)[0];
    if(estado==='APROBADO'&&sig&&TAB==='registros'&&REGF==='sin'){render(null,true);detalle(sig.id);}else{cerrarModal();render(null,true);}
  }catch(e){toast('Sin conexión');document.querySelectorAll('.rev .btn').forEach(b=>b.disabled=false);}
}
function cerrarModal(){$('#modal').classList.remove('show');}
$('#modal').onclick=e=>{if(e.target.id==='modal')cerrarModal();};

  nuevos.sort((a,b)=>(a.rg||a.ts)-(b.rg||b.ts));
  nuevos.slice(-3).forEach((r,i)=>setTimeout(()=>tarjeta(r),i*450));
  if(nuevos.length>3)setTimeout(()=>toast(`y ${nuevos.length-3} registros nuevos más`),1800);

  }
}
function tarjeta(r){

  const el=document.createElement('div'),dur=9000;

  box.appendChild(el);
  let t=setTimeout(fuera,dur);
  el.onmouseenter=()=>{clearTimeout(t);el.querySelector('.tm').style.animationPlayState='paused';};
  el.onmouseleave=()=>{t=setTimeout(fuera,3000);};
  el.onclick=e=>{const a=e.target.closest('button');if(!a)return;if(a.dataset.a==='ver')detalle(r.id);if(a.dataset.a==='mapa')verEnMapa(r.id);fuera();};
  function fuera(){el.classList.add('out');setTimeout(()=>el.remove(),380);}
}

/* =====================================================================
   MODO PANTALLA (monitor en oficina)
   ===================================================================== */
$('#tvBtn').onclick=()=>{
  TV=!TV;document.body.classList.toggle('tv',TV);$('#tvBtn').classList.toggle('on',TV);
  clearInterval(TVT);
  if(TV){
    try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){}
    const ciclo=['vivo','mapa','equipo','rutas'];let i=Math.max(0,ciclo.indexOf(TAB));
    irA(ciclo[i]);TVT=setInterval(()=>{if($('#modal').classList.contains('show'))return;i=(i+1)%ciclo.length;irA(ciclo[i]);},25000);
    toast('Modo pantalla: rota En vivo, Mapa, Equipo y Rutas cada 25 s');
  }else{try{document.fullscreenElement&&document.exitFullscreen();}catch(e){}}
};

pintarTabs();
const arrancar=()=>iniciar().then(programarPulso);
document.readyState==='loading'?addEventListener('DOMContentLoaded',arrancar):arrancar();
</script>
